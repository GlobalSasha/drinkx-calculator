<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>DrinkX — Калькулятор для ритейл сетей</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ═══ ARES · Pioneering the Crimson Frontier ═══
       Palette · #F97316 primary · #EA580C surface · #22C55E savings · #7C2D12 deep
       Rhythm · 4px base · Radii · 4/8/12/16/9999 · Shadows · multi-layer soft
       Type · Inter 200 display · 400 labels · 48px display
    */
    :root {
      --ar-bg: #F97316;
      --ar-surface: #EA580C;
      --ar-deep: #7C2D12;
      --ar-ink: #1A0B06;
      --ar-white: #FFFFFF;
      --ar-soft: #FB923C;
      --ar-green: #22C55E;
      --ar-green-soft: #86EFAC;
      --ar-red: #FECACA;
      --ar-glass: rgba(255,255,255,0.94);
      --ar-glass-dark: rgba(26,11,6,0.86);
      --ar-shadow-soft: 0 0 0 1px rgba(0,0,0,0.06), 0 1px 1px -0.5px rgba(0,0,0,0.06), 0 3px 3px -1.5px rgba(0,0,0,0.06), 0 6px 6px -3px rgba(0,0,0,0.06), 0 12px 12px -6px rgba(0,0,0,0.06), 0 24px 24px -12px rgba(0,0,0,0.06);
      --ar-shadow-hero: 0 2.8px 2.2px rgba(0,0,0,0.035), 0 6.7px 5.3px rgba(0,0,0,0.047), 0 12.5px 10px rgba(0,0,0,0.06), 0 22.3px 17.9px rgba(0,0,0,0.07), 0 41.8px 33.4px rgba(0,0,0,0.086), 0 100px 80px rgba(0,0,0,0.12);
    }
    * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    html, body {
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      font-weight: 300;
      letter-spacing: -0.01em;
      color: var(--ar-ink);
    }
    body {
      background: var(--ar-bg);
      background-image:
        radial-gradient(rgba(255,255,255,0.18) 1px, transparent 1px),
        radial-gradient(rgba(26,11,6,0.08) 1px, transparent 1px);
      background-size: 18px 18px, 18px 18px;
      background-position: 0 0, 9px 9px;
    }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(ellipse at 15% 0%, rgba(255,255,255,0.22) 0%, transparent 55%),
        radial-gradient(ellipse at 85% 100%, rgba(124,45,18,0.28) 0%, transparent 60%);
      animation: ar-breathe 12s ease-in-out infinite;
    }
    @keyframes ar-breathe {
      0%,100% { opacity: 1; }
      50% { opacity: 0.55; }
    }
    #app { position: relative; z-index: 1; }

    h1, .ar-display { font-weight: 200 !important; letter-spacing: -0.025em; line-height: 1.05; }
    h2 { font-weight: 300 !important; letter-spacing: -0.015em; }
    h3 { font-weight: 400 !important; }
    .ar-label { font-size: 14px; font-weight: 400; line-height: 20px; letter-spacing: 0.02em; }
    .ar-micro { font-size: 11px; font-weight: 400; line-height: 14px; letter-spacing: 0.08em; text-transform: uppercase; }

    .ar-card {
      background: var(--ar-glass);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.5);
      border-radius: 12px;
      box-shadow: var(--ar-shadow-soft);
    }
    .ar-card-hero {
      background: var(--ar-glass-dark);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      box-shadow: var(--ar-shadow-hero);
      color: var(--ar-white);
    }

    /* Hero controls — period selector + taxes toggle */
    /* Segmented control: a recessed track with a raised thumb.
       The thumb carries its own pill radius and sits inside the track's
       padding, so it follows the outline instead of being clipped by it. */
    .ar-seg {
      display: inline-flex; align-items: center; gap: 2px;
      padding: 3px;
      background: rgba(0,0,0,0.20);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 9999px;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.32),
                  inset 0 -1px 0 rgba(255,255,255,0.06),
                  0 1px 0 rgba(255,255,255,0.08);
    }
    .ar-seg button {
      padding: 5px 14px; background: transparent; color: rgba(255,255,255,0.58);
      border: none; border-radius: 9999px;
      font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 500;
      letter-spacing: 0.08em; cursor: pointer; white-space: nowrap;
      transition: color 160ms ease, background-color 160ms ease,
                  box-shadow 160ms ease, transform 160ms ease;
    }
    .ar-seg button:hover { color: var(--ar-white); background: rgba(255,255,255,0.10); }
    .ar-seg button:focus-visible {
      outline: 2px solid rgba(255,255,255,0.65); outline-offset: 2px;
    }
    .ar-seg button.active {
      color: var(--ar-white);
      background: linear-gradient(180deg, rgba(255,255,255,0.20), rgba(255,255,255,0) 58%),
                  var(--ar-surface);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.34),
                  inset 0 -1px 0 rgba(0,0,0,0.22),
                  0 2px 5px rgba(0,0,0,0.30),
                  0 1px 1px rgba(0,0,0,0.20);
      transform: translateY(-0.5px);
    }
    .ar-seg button.active:hover { background: linear-gradient(180deg, rgba(255,255,255,0.26), rgba(255,255,255,0) 58%), var(--ar-surface); }
    .ar-seg button:active { transform: translateY(0.5px); }
    @media (prefers-reduced-motion: reduce) {
      .ar-seg button { transition: none; }
      .ar-seg button.active, .ar-seg button:active { transform: none; }
    }
    .ar-tax-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 5px 14px; background: transparent;
      color: rgba(255,255,255,0.55); border: 1px solid rgba(255,255,255,0.18); border-radius: 9999px;
      font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 500;
      letter-spacing: 0.08em; cursor: pointer;
      transition: all 150ms ease;
    }
    .ar-tax-btn:hover { color: var(--ar-white); border-color: rgba(255,255,255,0.4); }
    .ar-tax-btn.on { background: var(--ar-surface); color: var(--ar-white); border-color: var(--ar-surface); }
    .ar-tax-btn .ar-tax-dot {
      width: 6px; height: 6px; border-radius: 9999px;
      background: rgba(255,255,255,0.4); transition: background 150ms ease;
    }
    .ar-tax-btn.on .ar-tax-dot { background: #FFFFFF; }

    /* Collapse button + panel — interactive pulse to invite click */
    .ar-collapse-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 14px; background: transparent;
      color: var(--ar-surface);
      border: 1px solid var(--ar-surface); border-radius: 9999px; cursor: pointer;
      font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 500;
      letter-spacing: 0.08em; text-transform: uppercase;
      transition: all 200ms ease;
      animation: ar-btn-pulse 2.6s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      will-change: box-shadow, transform;
    }
    @keyframes ar-btn-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(234, 88, 12, 0.0); }
      50%      { box-shadow: 0 0 0 5px rgba(234, 88, 12, 0.22); }
    }
    .ar-collapse-btn:hover {
      background: var(--ar-surface); color: var(--ar-white);
      transform: translateY(-1px);
      animation: none;
      box-shadow: 0 6px 16px rgba(234,88,12,0.4);
    }
    .ar-collapse-btn.open {
      background: var(--ar-deep); color: var(--ar-white); border-color: var(--ar-deep);
      animation: none; box-shadow: none;
    }
    .ar-collapse-btn .ar-chev { transition: transform 300ms ease; font-size: 9px; }
    .ar-collapse-btn.open .ar-chev { transform: rotate(180deg); }
    @media (prefers-reduced-motion: reduce) {
      .ar-collapse-btn { animation: none; }
    }
    .ar-collapse-panel {
      max-height: 0; overflow: hidden;
      transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .ar-collapse-panel.open { max-height: 1400px; }

    .ar-btn-primary {
      background: var(--ar-surface);
      color: var(--ar-white);
      border: none;
      border-radius: 0;
      padding: 14px 24px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: background 150ms ease, transform 150ms ease;
    }
    .ar-btn-primary:hover { background: var(--ar-ink); }
    .ar-btn-primary:active { transform: translateY(1px); }

    input[type="number"] {
      background: #FFFFFF !important;
      border: 1px solid rgba(124,45,18,0.2) !important;
      border-radius: 4px !important;
      font-weight: 400 !important;
      color: var(--ar-ink) !important;
      transition: border-color 150ms ease;
    }
    input[type="number"]:focus {
      outline: none;
      border-color: var(--ar-surface) !important;
      box-shadow: 0 0 0 3px rgba(249,115,22,0.15) !important;
    }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { opacity:.45 }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { display: inline-block; animation: spin 1s linear infinite; }

    /* ── Hero animations ─────────────────────────────────── */
    @keyframes ar-rise {
      from { opacity: 0; transform: translateY(10px); filter: blur(4px); }
      to { opacity: 1; transform: translateY(0); filter: blur(0); }
    }
    .ar-rise { animation: ar-rise 0.8s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .ar-rise-1 { animation-delay: 0.06s; }
    .ar-rise-2 { animation-delay: 0.14s; }
    .ar-rise-3 { animation-delay: 0.24s; }
    .ar-rise-4 { animation-delay: 0.36s; }
    .ar-rise-5 { animation-delay: 0.48s; }

    @keyframes ar-pulse-line {
      0%, 100% { opacity: 0.6; transform: scaleX(1); }
      50% { opacity: 1; transform: scaleX(1.4); }
    }
    .ar-pulse-line {
      display: inline-block;
      transform-origin: left center;
      animation: ar-pulse-line 2.4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    .ar-hero-glow { position: relative; }
    .ar-hero-glow::before {
      content: '';
      position: absolute;
      left: -5%;
      top: 15%;
      width: 55%;
      height: 80%;
      background: radial-gradient(ellipse at center, rgba(134,239,172,0.28) 0%, rgba(134,239,172,0.08) 40%, transparent 75%);
      filter: blur(50px);
      animation: ar-glow-breathe 6s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      pointer-events: none;
      z-index: 0;
    }
    @keyframes ar-glow-breathe {
      0%, 100% { opacity: 0.55; transform: scale(0.92) translateX(0); }
      50% { opacity: 1; transform: scale(1.08) translateX(4%); }
    }
    .ar-hero-glow > * { position: relative; z-index: 1; }

    /* Dashboard card hover lift */
    .ar-dash-card {
      cursor: default;
      transition: transform 320ms cubic-bezier(0.22, 1, 0.36, 1), box-shadow 320ms ease, border-color 320ms ease;
      will-change: transform;
    }
    .ar-dash-card:hover {
      transform: translateY(-3px) scale(1.015);
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.06),
        0 4px 4px -2px rgba(0,0,0,0.08),
        0 10px 10px -4px rgba(0,0,0,0.08),
        0 20px 20px -10px rgba(0,0,0,0.08),
        0 40px 40px -20px rgba(0,0,0,0.08),
        0 60px 60px -30px rgba(0,0,0,0.08);
      border-color: rgba(255,255,255,0.85);
    }

    /* Print — render full content, expand all collapse panels, hide controls */
    @media print {
      html, body { background: #FFFFFF !important; color: #000 !important; }
      body::before { display: none !important; }
      body { background-image: none !important; }
      .ar-seg, .ar-tax-btn, .ar-collapse-btn { display: none !important; }
      .ar-collapse-panel { max-height: none !important; overflow: visible !important; }
      .ar-card-hero { background: #1A0B06 !important; }
      .nx-lattice::before, .ar-lattice::before { display: none !important; }
      #app { padding: 16px !important; gap: 16px !important; }
      .adv-panel { max-height: none !important; }
      .print-keep-together {
        break-inside: avoid;
        page-break-inside: avoid;
        -webkit-column-break-inside: avoid;
      }
      canvas { max-width: 100% !important; height: 280px !important; }
    }

    /* Respect reduced motion — critical for accessibility */
    @media (prefers-reduced-motion: reduce) {
      body::before,
      .ar-rise,
      .ar-pulse-line,
      .ar-hero-glow::before { animation: none !important; }
      .ar-rise { opacity: 1; transform: none; filter: none; }
      .ar-dash-card { transition: none !important; }
      .ar-dash-card:hover { transform: none !important; }
    }

    .tw-pre { display:none }
    .tw-pre span {
      color: rgb(5 150 105);
      color: rgb(225 29 72);
      background-color: #d1fae5;
      background-color: #ffe4e6;
    }

    .adv-panel {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.45s cubic-bezier(0.4,0,0.2,1);
    }
    .adv-panel.open { max-height: 900px; }

    .tip-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: help;
    }
    .tip-box {
      display: none;
      position: fixed;
      width: 290px;
      background: var(--ar-ink);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 14px 16px;
      z-index: 9999;
      box-shadow: var(--ar-shadow-hero);
      pointer-events: none;
    }
    .tip-box::after {
      content: '';
      position: absolute;
      top: 100%;
      left: var(--arrow-left, 50%);
      transform: translateX(-50%);
      border: 7px solid transparent;
      border-top-color: var(--ar-ink);
    }
    .tip-box.tip-below::after {
      top: auto;
      bottom: 100%;
      border-top-color: transparent;
      border-bottom-color: var(--ar-ink);
    }
  </style>
</head>
<body class="min-h-screen">

<div class="tw-pre"><span></span></div>
<div id="app" class="max-w-7xl mx-auto" style="padding:32px 28px 48px;display:flex;flex-direction:column;gap:24px"></div>

<script>
/* ═══════════════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════════════ */
const BASE_DATE = new Date();

const MODEL = {
  version: '2026-09',
  date: 'сентябрь 2026',
  vatRate: 0.22,
  profitTaxRate: 0.20,
  discountRate: 0.12,            // discount rate used for NPV
  parkDiscounts: [               // fleet-size discount tiers, must be checked in descending minSize order
    { minSize: 50, discount: 0.10 },
    { minSize: 10, discount: 0.05 },
  ],
  defaults: {
    std: {
      name: 'Обычная кофемашина',
      basePrice: 700000,  parkSize: 50,
      coffeePrice: 1300,  coffeeBlackDose: 18, coffeeMilkDose: 18,
      milkPrice: 80,      milkDose: 190,
      averageCheck: 200,
      milkShare: 70,      cupsPerDay: 40,     opex: 9500,
      fraud: 25,
    },
    drx: {
      name: 'DrinkX',
      baseKitPrice: 1010981, optionsPrice: 568126,
      basePrice: 1579107, parkSize: 50,
      coffeePrice: 1600 / 3, coffeeBlackDose: 30, coffeeMilkDose: 17,
      milkPrice: 80,      milkDose: 190,
      averageCheck: 200,
      milkShare: 70,      cupsPerDay: 100,    opex: 3500,
      fraud: 0,
    },
  },
  rental: {
    offers: [
      { id: 'monthly', label: 'Помесячно, с пролонгацией', termMo: 1,  payment: 255000, buyout: false },
      { id: 'half',    label: 'Договор 6 месяцев',         termMo: 6,  payment: 215000, buyout: true  },
      { id: 'year',    label: 'Договор 1 год',             termMo: 12, payment: 195000, buyout: true  },
    ],
    buyoutCreditRate: 0.70,      // share of paid rent credited toward the buyout price
    buyoutFromMonth: 3,          // buyout is unavailable before month 3
    includes: ['Доставка и монтаж', 'Пусконаладка', 'Обучение персонала точки',
               'Сервисное обслуживание и выезды', 'Круглосуточный мониторинг',
               'Запасные части и расходные материалы по технике'],
  },
};

const state = {
  std: { ...MODEL.defaults.std },
  drx: { ...MODEL.defaults.drx },
  ui: { acquisitionMode: 'purchase', rentalOfferId: 'year' },
};

/* ═══════════════════════════════════════════════════════════
   CALCULATION
═══════════════════════════════════════════════════════════ */
function calculateOperations(d, model, taxesOn) {
  const costAmt    = (d.coffeePrice / 1000) * d.coffeeBlackDose;
  const costCap    = ((d.coffeePrice / 1000) * d.coffeeMilkDose)
                   + ((d.milkPrice   / 1000) * d.milkDose);
  const mR = d.milkShare / 100, bR = 1 - mR;
  const avgCost    = costAmt * bR + costCap * mR;
  const avgPrice   = d.averageCheck;
  const avgMargin  = avgPrice - avgCost;
  const mCups      = d.cupsPerDay * 30 * d.parkSize;
  const cogsPark   = mCups * avgCost;
  const fraudR     = Math.max(0, Math.min(100, d.fraud || 0)) / 100;
  const fraudLoss  = mCups * avgPrice * fraudR;
  let   profitPark = mCups * avgMargin - d.opex * d.parkSize - fraudLoss;

  if (taxesOn) {
    const VAT_FACTOR = model.vatRate / (1 + model.vatRate);
    const vatNet = mCups * avgPrice * VAT_FACTOR;
    profitPark -= vatNet;
    if (profitPark > 0) profitPark *= (1 - model.profitTaxRate);
  }

  return { costAmt, costCap, avgCost, avgPrice, avgMargin, mCups,
           cogsPark, fraudLoss, profitPark };
}

function calculatePurchase(ops, d, model) {
  let disc = 0;
  const parkDiscount = model.parkDiscounts.find(tier => d.parkSize >= tier.minSize);
  if (parkDiscount) disc = parkDiscount.discount;

  const capexTotal = d.basePrice * d.parkSize * (1 - disc);
  const paybackMo  = ops.profitPark > 0 ? capexTotal / ops.profitPark : Infinity;

  // Yearly metrics
  const yearlyExpenses = (ops.cogsPark + d.opex * d.parkSize + ops.fraudLoss) * 12;
  const profit1Year    = ops.profitPark * 12;
  const profit2Years   = ops.profitPark * 24;

  let paybackDate = 'Никогда (убыток)';
  if (isFinite(paybackMo)) {
    const pd = new Date(BASE_DATE);
    pd.setMonth(pd.getMonth() + Math.ceil(paybackMo));
    let s = pd.toLocaleString('ru-RU', { month: 'long', year: 'numeric' });
    paybackDate = s[0].toUpperCase() + s.slice(1);
  }
  return { disc: disc * 100, capexTotal, paybackMo, paybackDate,
           yearlyExpenses, profit1Year, profit2Years };
}

function calculateRental(ops, d, offer, model) {
  const paymentPark = offer.payment * d.parkSize;

  // Rental includes service, so the client's OPEX line is not paid separately in
  // rental mode. ops.profitPark already subtracted d.opex * d.parkSize, so add it
  // back before subtracting the rental payment.
  const profitAfterRent = ops.profitPark + d.opex * d.parkSize - paymentPark;
  const revenuePark = ops.mCups * ops.avgPrice;
  const rentShareOfRevenue = revenuePark > 0 ? paymentPark / revenuePark : null;

  let breakEvenCupsPerDay = null;
  if (ops.avgMargin > 0) {
    const pretaxProfitPark = ops.mCups * ops.avgMargin - d.opex * d.parkSize - ops.fraudLoss;
    const taxesOnInferred = Math.abs(ops.profitPark - pretaxProfitPark) > 1e-6;
    let lo = 0, hi = 100000;
    for (let i = 0; i < 200; i++) {
      const candidate = (lo + hi) / 2;
      const candOps = calculateOperations({ ...d, cupsPerDay: candidate }, model, taxesOnInferred);
      const candProfitAfterRent = candOps.profitPark + d.opex * d.parkSize - paymentPark;
      if (candProfitAfterRent < 0) lo = candidate; else hi = candidate;
    }
    breakEvenCupsPerDay = (lo + hi) / 2;
  }

  const buyout = [];
  if (offer.buyout) {
    [3, 6, 9, 12].forEach(month => {
      const paid = offer.payment * month;
      const credit = Math.min(paid * model.rental.buyoutCreditRate, d.basePrice);
      const topUp = d.basePrice - credit;
      const total = paid + topUp;
      buyout.push({ month, paid, credit, topUp, total });
    });
  }

  const ownershipMonth = offer.buyout
    ? Math.ceil(d.basePrice / (offer.payment * model.rental.buyoutCreditRate))
    : null;

  return { paymentPark, profitAfterRent, rentShareOfRevenue,
           breakEvenCupsPerDay, buyout, ownershipMonth };
}

// Rental cost through month N. Buyout-enabled offers stop billing rent
// once ownership transfers at ownershipMonth (paid via calculateRental);
// from then on the client only carries its own OPEX per unit, same as
// an owner would. Offers without buyout keep accruing rent linearly for
// the whole horizon.
function calculateRentalCost(offer, ownershipMonth, opexPerUnit, parkSize, months) {
  if (!offer.buyout || months <= ownershipMonth) {
    return offer.payment * parkSize * months;
  }
  return offer.payment * parkSize * ownershipMonth
       + opexPerUnit * parkSize * (months - ownershipMonth);
}

function buildMonthlyCashFlow(ops, financing, months) {
  // financing.mode: 'purchase' | 'rental'. Rental has no upfront capex — the
  // station is never bought outright — and each month contributes the
  // after-rent profit instead of the raw park profit.
  const initial = financing.mode === 'rental' ? 0 : financing.capexTotal;
  const monthlyProfit = financing.mode === 'rental' ? financing.profitAfterRent : ops.profitPark;
  const cashFlow = [-initial];
  for (let month = 1; month <= months; month++) cashFlow.push(monthlyProfit);
  return cashFlow;
}

function calculateCrossoverMonth(capexTotal, opexPerUnit, rentPaymentPerUnit, parkSize, maxMonths = 60) {
  // Ownership cost through month N: capexTotal + opexPerUnit * parkSize * N.
  // Rental cost through month N: rentPaymentPerUnit * parkSize * N.
  // Return the first month when rental is strictly more expensive than ownership.
  const denom = (rentPaymentPerUnit - opexPerUnit) * parkSize;
  if (denom <= 0) return null;
  const month = Math.floor(capexTotal / denom) + 1;
  return month <= maxMonths ? month : null;
}

function calc(d) {
  const ops = calculateOperations(d, MODEL, window.__taxesOn);
  const purchase = calculatePurchase(ops, d, MODEL);
  return { disc: purchase.disc, capexTotal: purchase.capexTotal,
           costAmt: ops.costAmt, costCap: ops.costCap, avgCost: ops.avgCost,
           cogsPark: ops.cogsPark, avgPrice: ops.avgPrice, avgMargin: ops.avgMargin,
           profitPark: ops.profitPark, paybackMo: purchase.paybackMo,
           paybackDate: purchase.paybackDate, yearlyExpenses: purchase.yearlyExpenses,
           profit1Year: purchase.profit1Year, profit2Years: purchase.profit2Years };
}

/* NPV — discounted at the model annual rate over `months` months */
function calcNPV(profit, capex, months = 36, annualRate = MODEL.discountRate) {
  const r = Math.pow(1 + annualRate, 1 / 12) - 1; // monthly rate
  if (r === 0) return -capex + profit * months;
  return -capex + profit * (1 - Math.pow(1 + r, -months)) / r;
}

/* IRR — bisection, return annual %, or null if not solvable */
function calcIRR(profit, capex, months = 36) {
  if (profit <= 0 || capex <= 0) return null;
  if (profit * months < capex) return null; // can't break even
  let lo = -0.9999, hi = 10.0;
  for (let i = 0; i < 200; i++) {
    const mid = (lo + hi) / 2;
    const r = mid;
    let npv;
    if (Math.abs(r) < 1e-9) {
      npv = -capex + profit * months;
    } else {
      npv = -capex + profit * (1 - Math.pow(1 + r, -months)) / r;
    }
    if (npv > 0) lo = mid; else hi = mid;
  }
  const rMonthly = (lo + hi) / 2;
  return (Math.pow(1 + rMonthly, 12) - 1) * 100;
}

const fCur  = v => new Intl.NumberFormat('ru-RU', { style:'currency', currency:'RUB', maximumFractionDigits:0 }).format(v);
const fCost = v => new Intl.NumberFormat('ru-RU', { style:'currency', currency:'RUB', maximumFractionDigits:2 }).format(v);
const fPct  = v => v == null ? 'N/A' : (v >= 0 ? '+' : '') + v.toFixed(1) + '%';

/* Compact ru format — млн / тыс / ₽ depending on magnitude */
function fLargeRu(v, signed = false) {
  if (!isFinite(v)) return '—';
  const sign = v >= 0 ? (signed ? '+' : '') : '−';
  const abs = Math.abs(v);
  if (abs >= 1_000_000) {
    const mln = abs / 1_000_000;
    const fixed = mln >= 100 ? mln.toFixed(1) : mln.toFixed(2);
    return `${sign}${fixed.replace('.', ',')} млн ₽`;
  }
  if (abs >= 1_000) {
    return `${sign}${(abs / 1_000).toFixed(0)} тыс ₽`;
  }
  return `${sign}${abs.toFixed(0)} ₽`;
}

/* ═══════════════════════════════════════════════════════════

═══════════════════════════════════════════════════════════ */
function setText(id, val) {
  const el = document.getElementById(id);
  if (el) el.textContent = val;
}

/* Count-up on first mount; snap on subsequent updates.
   Respects prefers-reduced-motion. */
const _reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
function setHeroNumber(el, target, format) {
  if (_reducedMotion || el.dataset.mounted === '1') {
    el.textContent = format(target);
    el.dataset.current = target;
    el.dataset.mounted = '1';
    return;
  }
  el.dataset.mounted = '1';
  const start = 0;
  const delta = target - start;
  const duration = 1200;
  const startTime = performance.now();
  // cancel any previous rAF
  if (el._raf) cancelAnimationFrame(el._raf);
  const tick = (now) => {
    const elapsed = now - startTime;
    const t = Math.min(elapsed / duration, 1);
    // easeOutCubic
    const eased = 1 - Math.pow(1 - t, 3);
    const v = start + delta * eased;
    el.textContent = format(v);
    el.dataset.current = v;
    if (t < 1) el._raf = requestAnimationFrame(tick);
  };
  el._raf = requestAnimationFrame(tick);
}

function updateChart(sm, dm, isRental, offer, rr) {
  if (!chart) return;
  const periodMo = window.__periodMo || 36;
  if (chart.data.labels.length !== periodMo + 1) {
    chart.data.labels = Array.from({length: periodMo + 1}, (_, i) => i);
  }

  const cumulative = cashFlow => {
    let total = 0;
    return cashFlow.map(amount => Math.round(total += amount));
  };
  const stdCashFlow = buildMonthlyCashFlow(
    sm,
    { mode: 'purchase', capexTotal: sm.capexTotal },
    periodMo
  );
  const drxCashFlow = buildMonthlyCashFlow(
    dm,
    isRental
      ? { mode: 'rental', profitAfterRent: rr.profitAfterRent }
      : { mode: 'purchase', capexTotal: dm.capexTotal },
    periodMo
  );

  chart.data.datasets[0].data = cumulative(stdCashFlow);
  chart.data.datasets[1].data = cumulative(drxCashFlow);
  chart.data.datasets[1].label = isRental ? `DrinkX — аренда, ${offer.label}` : 'DrinkX';
  chart.update();
}

                  <td style="padding:5px 4px">${row.month}</td>
                  <td style="padding:5px 4px;text-align:right">${fCur(row.paid)}</td>
                  <td style="padding:5px 4px;text-align:right">${fCur(row.credit)}</td>
                  <td style="padding:5px 4px;text-align:right">${fCur(row.topUp)}</td>
                  <td style="padding:5px 4px;text-align:right;font-weight:500">${fCur(row.total)}</td>
                </tr>`).join('')}
              </tbody>
            </table>
          </div>
          <div class="flex items-start justify-between" style="gap:12px;padding-top:9px;margin-top:8px;border-top:1px solid rgba(124,45,18,0.15)">
            <span style="font-size:11px;color:var(--ar-ink);font-weight:400;line-height:1.4">Станция переходит к вам на ${rr.ownershipMonth}-м месяце без доплаты</span>
            <span style="font-size:11px;color:var(--ar-deep);font-weight:500;text-align:right;flex-shrink:0">${ownershipDateText}</span>
          </div>`;
      }
    }
  }

  // ── Purchase vs rental ─────────────────────────────────
  const crossoverMonth = calculateCrossoverMonth(
    dm.capexTotal,
    state.drx.opex,
    offer.payment,
    state.drx.parkSize
  );
  setText('purchase-rental-summary', crossoverMonth === 1
    ? 'Аренда дороже владения уже с первого месяца — на этом горизонте выгоднее сразу покупать.'
    : crossoverMonth == null
      ? 'На горизонте до 60 месяцев аренда не становится дороже владения.'
      : `На горизонте до ${crossoverMonth - 1} месяцев дешевле аренда, дальше — покупка со своим обслуживанием.`);
  setText('purchase-rental-heading', `Аренда, ${offer.label}`);
  setText('purchase-rental-ownership-note', isRental
    ? offer.buyout
      ? `По выбранному договору станция переходит в собственность на ${rr.ownershipMonth}-м месяце без доплаты.`
      : 'Помесячный договор выкупа не предусматривает: оборудование остаётся в нашей собственности.'
    : 'У части тарифов аренды предусмотрен переход станции в собственность клиента после выкупа; в помесячном тарифе выкупа нет.');
  const comparisonRows = document.getElementById('purchase-rental-rows');
  if (comparisonRows) {
    comparisonRows.innerHTML = [12, 24, 36, 60].map(months => {
      const ownershipCost = dm.capexTotal + state.drx.opex * state.drx.parkSize * months;
      const rentalCost = calculateRentalCost(offer, rr.ownershipMonth, state.drx.opex, state.drx.parkSize, months);
      return `
        <tr style="border-bottom:1px solid rgba(124,45,18,0.08)">
          <td style="padding:7px 6px">${months} мес.</td>
          <td style="padding:7px 6px;text-align:right">${fCur(ownershipCost)}</td>
          <td style="padding:7px 6px;text-align:right">${fCur(rentalCost)}</td>
        </tr>`;
    }).join('');
  }

  // ── Dashboard ──────────────────────────────────────────
  const profitDiff  = dm.profitPark - sm.profitPark;
  const marginDiff  = dm.avgMargin  - sm.avgMargin;
  const marginPct   = sm.avgMargin > 0 ? (marginDiff / sm.avgMargin) * 100 : 0;

  updateDashCard('d-profit',
    fLargeRu(profitDiff, true),
    profitDiff >= 0, false);

  const marginPctStr = marginPct === 0 ? '' : ` (${marginPct > 0 ? '+' : ''}${marginPct.toFixed(1)}%)`;
  updateDashCard('d-margin',
    (marginDiff > 0 ? '+' : '') + fCost(marginDiff) + marginPctStr,
    marginDiff >= 0, false);

  const stdPaysBack = isFinite(sm.paybackMo);
  const drxPaysBack = isFinite(dm.paybackMo);
  if (!stdPaysBack && !drxPaysBack) {
    updateDashCard('d-payback', 'Оба убыточны', false, true);
  } else if (!stdPaysBack) {
    updateDashCard('d-payback', 'DrinkX окупается, обычная — никогда', true, false);
  } else if (!drxPaysBack) {
    updateDashCard('d-payback', 'Обычная окупается, DrinkX — никогда', false, false);
  } else {
    const paybackDiff = sm.paybackMo - dm.paybackMo;
    updateDashCard('d-payback',
      paybackDiff === 0 ? 'Одинаково' :
      paybackDiff > 0 ? `Быстрее на ${paybackDiff.toFixed(1)} мес.` :
      `Медленнее на ${Math.abs(paybackDiff).toFixed(1)} мес.`,
      paybackDiff > 0, paybackDiff === 0);
  }

  // ── Hero Banner ────────────────────────────────────────
  const periodMo = window.__periodMo || 36;
  const periodYrs = periodMo / 12;
  const net3yr = profitDiff * periodMo - (dm.capexTotal - sm.capexTotal);
  const hEl    = document.getElementById('hero-net3yr');
  const hSub   = document.getElementById('hero-net3yr-sub');
  const hLabel = document.getElementById('hero-period-label');
  if (hLabel) {
    const yrsStr = periodYrs % 1 === 0 ? `${periodYrs}` : periodYrs.toFixed(1);
    const yrsWord = periodYrs === 1 ? 'ГОД' : (periodYrs >= 2 && periodYrs < 5) ? 'ГОДА' : 'ЛЕТ';
    hLabel.textContent = `ПРИБЫЛЬ ЗА ${yrsStr} ${yrsWord}`;
  }
  if (hEl) {
    hEl.style.color = net3yr >= 0 ? '#86EFAC' : '#FECACA';
    setHeroNumber(hEl, net3yr, v => fLargeRu(v, true));
  }
  if (hSub) {
    hSub.textContent = net3yr >= 0
      ? `С учётом разницы CAPEX ${fCur(dm.capexTotal - sm.capexTotal)}` + (window.__taxesOn ? ` · с НДС ${Math.round(MODEL.vatRate * 100)}% и налогом 20%` : '')
      : `DrinkX менее выгоден на ${periodYrs}-летнем горизонте при текущих параметрах`;
  }
  const delayEl = document.getElementById('hero-delay');
  if (delayEl) {
    delayEl.style.color = profitDiff > 0 ? '#FECACA' : 'rgba(255,255,255,0.55)';
    setHeroNumber(delayEl, Math.abs(profitDiff), v => fLargeRu(v) + '/мес.');
  }

  // ── Advanced Section ───────────────────────────────────
  const stdNPV = calcNPV(sm.profitPark, sm.capexTotal, periodMo);
  const drxNPV = calcNPV(dm.profitPark, dm.capexTotal, periodMo);
  const stdIRR = calcIRR(sm.profitPark, sm.capexTotal, periodMo);
  const drxIRR = calcIRR(dm.profitPark, dm.capexTotal, periodMo);
  const stdPPM = state.std.parkSize > 0 ? sm.profitPark / state.std.parkSize : 0;
  const drxPPM = state.drx.parkSize > 0 ? dm.profitPark / state.drx.parkSize : 0;

  setText('adv-npv-std', fLargeRu(stdNPV));
  setText('adv-npv-drx', fLargeRu(drxNPV));
  setText('adv-irr-std', stdIRR != null ? fPct(stdIRR) : 'N/A');
  setText('adv-irr-drx', drxIRR != null ? fPct(drxIRR) : 'N/A');
  setText('adv-ppm-std', fLargeRu(stdPPM));
  setText('adv-ppm-drx', fLargeRu(drxPPM));

  const irrEl = document.getElementById('adv-irr-drx');
  if (state.ui.acquisitionMode === 'rental') {
    const rentalNPV = calcNPV(rr.profitAfterRent, 0, periodMo);
    setText('adv-npv-drx', fLargeRu(rentalNPV));
    if (irrEl) {
      irrEl.textContent = '—';
      irrEl.title = 'Нет капитальных затрат, показатель не определён';
    }
    setText('adv-ppm-drx', state.drx.parkSize > 0
      ? fLargeRu(rr.profitAfterRent / state.drx.parkSize)
      : fLargeRu(0));
  } else if (irrEl) {
    irrEl.removeAttribute('title');
  }

  setText('adv-npv-tip', isRental ? TIP_NPV_RENTAL : TIP_NPV_PURCHASE);
  setText('adv-irr-tip', isRental ? TIP_IRR_RENTAL : TIP_IRR_PURCHASE);
  setText('cf-formula-text', isRental
    ? 'Накопительная прибыль DrinkX = Прибыль после аренды × Месяцы, без вычета CAPEX. Линия DrinkX отражает экономику после арендного платежа; обычная кофемашина — экономику покупки с вычетом CAPEX.'
    : 'Накопительная прибыль = (Ежемесячная прибыль × Месяцы) − CAPEX. Пересечение нулевой оси = полная окупаемость.');
  updateChart(sm, dm, isRental, offer, rr);
}

   RULE-BASED TEXT GENERATORS
═══════════════════════════════════════════════════════════ */
function generateAuditText(sm, dm, std, drx, rental) {
  const L = [];

  const dmProfit = rental ? rental.rr.profitAfterRent : dm.profitPark;
  const smProfit = sm.profitPark;
  const smLoss = smProfit < 0;
  const dmLoss = dmProfit < 0;

  // Loss is the first thing the reader sees, not buried mid-text.
  if (smLoss || dmLoss) {
    if (smLoss && dmLoss) {
      L.push(`УБЫТОК: обе модели убыточны при текущих параметрах — ${std.name}: ${fCur(smProfit)}/мес., ${drx.name}: ${fCur(dmProfit)}/мес.`);
    } else if (dmLoss) {
      L.push(`УБЫТОК: ${drx.name} приносит убыток ${fCur(dmProfit)}/мес. при текущих параметрах.`);
    } else {
      L.push(`УБЫТОК: ${std.name} приносит убыток ${fCur(smProfit)}/мес. при текущих параметрах.`);
    }
    L.push('');
  }

  L.push('ВЕРДИКТ');

  if (rental) {
    const rr = rental.rr;
    const profitDiff = dmProfit - smProfit;
    if (dmProfit > smProfit) {
      L.push(`${drx.name} по арендной схеме «${rental.offer.label}» даёт точке больше прибыли, чем ${std.name} при покупке: ${fCur(dmProfit)}/мес. против ${fCur(smProfit)}/мес. (разница ${fCur(profitDiff)}/мес.).`);
    } else if (dmProfit < smProfit) {
      L.push(`При аренде «${rental.offer.label}» ${drx.name} приносит точке меньше, чем ${std.name} при покупке: ${fCur(dmProfit)}/мес. против ${fCur(smProfit)}/мес. (разница ${fCur(profitDiff)}/мес.).`);
    } else {
      L.push(`При аренде «${rental.offer.label}» прибыль точки на ${drx.name} и на ${std.name} совпадает: ${fCur(dmProfit)}/мес.`);
    }
    L.push('');
    L.push('АРЕНДНАЯ ЭКОНОМИКА');
    L.push(`- Платёж за парк — ${fCur(rr.paymentPark)}/мес. (тариф «${rental.offer.label}»)`);
    L.push(`- Прибыль точки после платежа — ${fCur(rr.profitAfterRent)}/мес.`);
    L.push(`- Платёж к выручке точки — ${rr.rentShareOfRevenue == null ? '—' : `${(rr.rentShareOfRevenue * 100).toFixed(1)}%`}`);
    L.push(`- Переход собственности — ${rental.offer.buyout ? `${rr.ownershipMonth}-й месяц` : 'не предусмотрен по этому тарифу'}`);
  } else {
    const drxWinProfit  = dm.profitPark > sm.profitPark;
    const drxWinPayback = isFinite(dm.paybackMo) && (!isFinite(sm.paybackMo) || dm.paybackMo < sm.paybackMo);
    const profitDiff    = dm.profitPark - sm.profitPark;
    const paybackDiffMo = isFinite(sm.paybackMo) && isFinite(dm.paybackMo)
                            ? Math.abs(sm.paybackMo - dm.paybackMo).toFixed(1) : null;

    if (drxWinProfit && drxWinPayback) {
      L.push(`${drx.name} выгоднее по обоим ключевым показателям: окупается быстрее${paybackDiffMo ? ` (на ${paybackDiffMo} мес.)` : ''} и даёт больше прибыли (${fCur(profitDiff)}/мес.).`);
    } else if (!drxWinProfit && !drxWinPayback) {
      const d = sm.profitPark - dm.profitPark;
      L.push(`${std.name} выгоднее при текущих вводных: окупается быстрее${paybackDiffMo ? ` (на ${paybackDiffMo} мес.)` : ''} и даёт больше прибыли (${fCur(d)}/мес.).`);
    } else if (drxWinProfit && !drxWinPayback) {
      L.push(`${drx.name} даёт больше прибыли в месяц (${fCur(Math.abs(profitDiff))} разница), но окупается дольше — CAPEX парка выше.`);
    } else {
      L.push(`${std.name} окупается быстрее за счёт меньшего CAPEX, но ${drx.name} обгоняет по ежемесячной прибыли (${fCur(Math.abs(profitDiff))} разница).`);
    }

    L.push('');
    L.push('КЛЮЧЕВЫЕ ЦИФРЫ');
    L.push(`- Прибыль/мес — ${std.name}: ${fCur(sm.profitPark)} | ${drx.name}: ${fCur(dm.profitPark)}`);
    L.push(`- Маржа/чашка — ${std.name}: ${fCost(sm.avgMargin)} | ${drx.name}: ${fCost(dm.avgMargin)}`);
    L.push(`- Срок окупаемости — ${std.name}: ${isFinite(sm.paybackMo) ? sm.paybackMo.toFixed(1) + ' мес.' : 'не окупается'} | ${drx.name}: ${isFinite(dm.paybackMo) ? dm.paybackMo.toFixed(1) + ' мес.' : 'не окупается'}`);
    L.push(`- CAPEX парка — ${std.name}: ${fCur(sm.capexTotal)} | ${drx.name}: ${fCur(dm.capexTotal)}`);
  }

  return L.join('\n');
}

═══════════════════════════════════════════════════════════ */
function initTooltips() {
  document.querySelectorAll('.tip-wrap').forEach(wrap => {
    const box = wrap.querySelector('.tip-box');
    if (!box) return;

    wrap.addEventListener('mouseenter', () => {
      box.style.display = 'block';
      const bw = 290;
      const margin = 10;
      const rect = wrap.getBoundingClientRect();
      const bh = box.offsetHeight;

      // Horizontal: center on element, clamp to viewport
      let left = rect.left + rect.width / 2 - bw / 2;
      left = Math.max(8, Math.min(left, window.innerWidth - bw - 8));

      // Vertical: prefer above, flip below if not enough room
      let top = rect.top - bh - margin;
      let arrowPos = '50%';
      if (top < 8) {
        top = rect.bottom + margin;
        box.classList.add('tip-below');
      } else {
        box.classList.remove('tip-below');
      }

      // Recalc arrow X relative to box
      const centerX = rect.left + rect.width / 2;
      arrowPos = Math.round(centerX - left) + 'px';
      box.style.setProperty('--arrow-left', arrowPos);

      box.style.left = left + 'px';
      box.style.top  = top  + 'px';
    });

    wrap.addEventListener('mouseleave', () => {
      box.style.display = 'none';
    });
  });
}

/* ═══════════════════════════════════════════════════════════
   PERIOD + TAXES — global controls in hero
═══════════════════════════════════════════════════════════ */
window.__periodMo = 36;
window.__taxesOn  = false;

/* ─── Shareable calculation link ─────────────────────────── */
const SHARE_HASH_PREFIX = 'calc=';
const SHARE_VERSION = 2;
const SHARE_MAX_HASH_LENGTH = 20000;
const SHARE_RESTORE_NOTICE_OLD_VERSION = 'Ссылка создана в старой версии калькулятора, расчёт открыт со значениями по умолчанию';
const SHARE_RESTORE_NOTICE_UNRECOGNIZED = 'Ссылка не распознана — возможно, она повреждена или ведёт на другой калькулятор. Расчёт открыт со значениями по умолчанию';

function encodeSharePayload(payload) {
  const json = JSON.stringify(payload);
  const bytes = new TextEncoder().encode(json);
  let binary = '';
  bytes.forEach(byte => { binary += String.fromCharCode(byte); });
  return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
}

function decodeSharePayload(encoded) {
  const padded = encoded.replace(/-/g, '+').replace(/_/g, '/').padEnd(Math.ceil(encoded.length / 4) * 4, '=');
  const binary = atob(padded);
  const bytes = Uint8Array.from(binary, ch => ch.charCodeAt(0));
  return JSON.parse(new TextDecoder().decode(bytes));
}

function serializableStateItem(item) {
  return Object.fromEntries(
    Object.entries(item).filter(([key]) => key !== 'name')
  );
}

function getSharePayload() {
  return {
    v: SHARE_VERSION,
    mode: state.ui.acquisitionMode,
    offer: state.ui.rentalOfferId,
    periodMo: window.__periodMo || 36,
    taxesOn: !!window.__taxesOn,
    std: serializableStateItem(state.std),
    drx: serializableStateItem(state.drx),
  };
}

function showShareRestoreNotice(message) {
  let notice = document.getElementById('share-restore-notice');
  if (!notice) {
    notice = document.createElement('div');
    notice.id = 'share-restore-notice';
    notice.setAttribute('role', 'alert');
    Object.assign(notice.style, {
      position: 'fixed', top: '16px', left: '50%', transform: 'translateX(-50%)',
      zIndex: '9999', maxWidth: '680px', padding: '12px 16px', borderRadius: '8px',
      background: '#7C2D12', color: '#FFFFFF', fontSize: '14px', lineHeight: '1.4',
      boxShadow: '0 8px 24px rgba(0,0,0,0.2)'
    });
    document.body.appendChild(notice);
  }
  notice.textContent = message;
}

function applySharedStateFromHash() {
  if (!location.hash.startsWith(`#${SHARE_HASH_PREFIX}`)) return false;

  try {
    const encoded = location.hash.slice(SHARE_HASH_PREFIX.length + 1);
    if (!encoded || encoded.length > SHARE_MAX_HASH_LENGTH) throw new Error('Некорректная длина ссылки');
    const payload = decodeSharePayload(encoded);
    if (!payload || typeof payload !== 'object' || Array.isArray(payload)) {
      throw new Error('Некорректный формат данных');
    }

    const version = Number(payload.v);
    if (!Number.isFinite(version) || version < SHARE_VERSION) {
      showShareRestoreNotice(SHARE_RESTORE_NOTICE_OLD_VERSION);
      return false;
    }

    const validModes = ['purchase', 'rental'];
    const validOfferIds = MODEL.rental.offers.map(offer => offer.id);
    state.ui.acquisitionMode = typeof payload.mode === 'string' && validModes.includes(payload.mode)
      ? payload.mode
      : 'purchase';
    state.ui.rentalOfferId = typeof payload.offer === 'string' && validOfferIds.includes(payload.offer)
      ? payload.offer
      : 'year';

    ['std', 'drx'].forEach(key => {
      if (!payload[key] || typeof payload[key] !== 'object') return;
      Object.keys(state[key]).forEach(field => {
        if (field === 'name' || payload[key][field] == null) return;
        const value = Number(payload[key][field]);
        if (Number.isFinite(value)) state[key][field] = value;
      });
    });

    const period = Number(payload.periodMo);
    if ([36, 48, 60].includes(period)) window.__periodMo = period;
    window.__taxesOn = !!payload.taxesOn;
    return true;
  } catch (error) {
    console.warn('Не удалось восстановить расчёт из ссылки:', error);
    showShareRestoreNotice(SHARE_RESTORE_NOTICE_UNRECOGNIZED);
    return false;
  }
}

function buildShareUrl() {
  const url = new URL(location.href);
  url.hash = `${SHARE_HASH_PREFIX}${encodeSharePayload(getSharePayload())}`;
  return url.toString();
}

window.copyShareLink = async function(button) {
  const url = buildShareUrl();
  const originalText = button ? button.textContent : '';

  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(url);
    } else {
      const input = document.createElement('textarea');
      input.value = url;
      input.setAttribute('readonly', '');
      input.style.position = 'fixed';
      input.style.left = '-9999px';
      document.body.appendChild(input);
      input.select();
      document.execCommand('copy');
      document.body.removeChild(input);
    }

    if (button) {
      button.textContent = '✓ СКОПИРОВАНО';
      setTimeout(() => { button.textContent = originalText; }, 1800);
    }

    history.replaceState(null, '', url);
  } catch (error) {
    prompt('Скопируйте ссылку на расчёт:', url);
  }
};

/* ─── Export: CSV (для Excel) ────────────────────────────── */
function buildExportRows() {
  const sm = calc(state.std);
  const dm = calc(state.drx);
  const isRental = state.ui.acquisitionMode === 'rental';
  const offer = MODEL.rental.offers.find(o => o.id === state.ui.rentalOfferId) || MODEL.rental.offers[0];
  const drxOps = calculateOperations(state.drx, MODEL, window.__taxesOn);
  const rr = calculateRental(drxOps, state.drx, offer, MODEL);
  const periodMo = window.__periodMo || 36;
  const stdNPV = calcNPV(sm.profitPark, sm.capexTotal, periodMo);
  const drxNPV = calcNPV(dm.profitPark, dm.capexTotal, periodMo);
  const stdIRR = calcIRR(sm.profitPark, sm.capexTotal, periodMo);
  const drxIRR = calcIRR(dm.profitPark, dm.capexTotal, periodMo);
  const stdPPM = state.std.parkSize > 0 ? sm.profitPark / state.std.parkSize : 0;
  const drxPPM = state.drx.parkSize > 0 ? dm.profitPark / state.drx.parkSize : 0;
  const round  = (v, d=2) => isFinite(v) ? Number(v.toFixed(d)) : '';
  const rows = [];
  rows.push(['DrinkX ROI · Калькулятор для ритейл-сетей', '', '']);
  rows.push([`Дата: ${new Date().toLocaleString('ru-RU')}`, '', '']);
  rows.push([`Период расчёта: ${periodMo} мес.`, `Налоги (НДС ${Math.round(MODEL.vatRate * 100)}% + 20%): ${window.__taxesOn ? 'Вкл' : 'Выкл'}`, '']);
  rows.push([`Модель: ${MODEL.date}`, '', '']);
  rows.push([`Способ получения: ${isRental ? `Аренда, ${offer.label}` : 'Покупка'}`, '', '']);
  rows.push(['', '', '']);
  rows.push(['Параметр', 'Обычная кофемашина', 'DrinkX']);
  rows.push(['— ВХОДНЫЕ ПАРАМЕТРЫ —', '', '']);
  rows.push(['Базовая комплектация, ₽',           '—',                        state.drx.baseKitPrice]);
  rows.push(['Опции, ₽',                          '—',                        state.drx.optionsPrice]);
  rows.push(['Станция целиком, ₽',                state.std.basePrice,        state.drx.basePrice]);
  rows.push(['Количество машин в парке',           state.std.parkSize,         state.drx.parkSize]);
  rows.push(['Стоимость кофе/концентрата, ₽ за 1 кг (или 1 л для DrinkX)', state.std.coffeePrice, round(state.drx.coffeePrice, 2)]);
  rows.push(['Чёрный кофе — доза',                 `${state.std.coffeeBlackDose} г`, `${state.drx.coffeeBlackDose} мл`]);
  rows.push(['Молочный напиток — доза',            `${state.std.coffeeMilkDose} г`,  `${state.drx.coffeeMilkDose} мл`]);
  rows.push(['Молоко (за 1 л), ₽',                 state.std.milkPrice,        state.drx.milkPrice]);
  rows.push(['Расход молока на порцию, мл',        state.std.milkDose,         state.drx.milkDose]);
  rows.push(['Средний чек, ₽',                     state.std.averageCheck,     state.drx.averageCheck]);
  rows.push(['Доля молочных напитков, %',          state.std.milkShare,        state.drx.milkShare]);
  rows.push(['Чашек в день (на 1 машину)',         state.std.cupsPerDay,       state.drx.cupsPerDay]);
  rows.push(['OPEX на 1 точку в месяц, ₽',         state.std.opex,             state.drx.opex]);
  rows.push(['Фрод (воровство от продаж), %',      state.std.fraud,            state.drx.fraud]);
  rows.push(['', '', '']);
  rows.push(['— РАСЧЁТНЫЕ ПОКАЗАТЕЛИ —', '', '']);
  rows.push(['Итоговый CAPEX парка, ₽',            round(sm.capexTotal),       round(dm.capexTotal)]);
  rows.push(['Скидка за объём, %',                 sm.disc,                    dm.disc]);
  rows.push(['С/с Американо, ₽',                   round(sm.costAmt),          round(dm.costAmt)]);
  rows.push(['С/с Капучино, ₽',                    round(sm.costCap),          round(dm.costCap)]);
  rows.push(['Средняя с/с (взвешенная), ₽',        round(sm.avgCost),          round(dm.avgCost)]);
  rows.push(['Средняя цена продажи, ₽',            round(sm.avgPrice),         round(dm.avgPrice)]);
  rows.push(['Средняя маржа с 1 чашки, ₽',         round(sm.avgMargin),        round(dm.avgMargin)]);
  rows.push(['Прибыль парка / мес, ₽',             round(sm.profitPark),       round(dm.profitPark)]);
  rows.push(['Прибыль за 1 год, ₽',                round(sm.profit1Year),      round(dm.profit1Year)]);
  rows.push(['Прибыль за 2 года, ₽',               round(sm.profit2Years),     round(dm.profit2Years)]);
  rows.push(['Затраты за год (COGS+OPEX+фрод), ₽', round(sm.yearlyExpenses),   round(dm.yearlyExpenses)]);
  rows.push(['Срок окупаемости, мес',              isFinite(sm.paybackMo) ? round(sm.paybackMo, 1) : 'Никогда', isFinite(dm.paybackMo) ? round(dm.paybackMo, 1) : 'Никогда']);
  rows.push(['Дата окупаемости',                   sm.paybackDate,             dm.paybackDate]);
  rows.push([`NPV (${periodMo} мес.), ₽`,          round(stdNPV),              round(drxNPV)]);
  rows.push([`IRR (${periodMo} мес.), %`,          stdIRR != null ? round(stdIRR, 1) : 'N/A', drxIRR != null ? round(drxIRR, 1) : 'N/A']);
  rows.push(['Прибыль / 1 машина / мес, ₽',        round(stdPPM),              round(drxPPM)]);
  rows.push(['', '', '']);
  rows.push(['— СРАВНЕНИЕ DRINKX vs. КОФЕМАШИНА —', '', '']);
  rows.push(['Доп. прибыль / мес, ₽',              '',                         round(dm.profitPark - sm.profitPark)]);
  rows.push(['Прибавка маржи / чашка, ₽',          '',                         round(dm.avgMargin - sm.avgMargin)]);
  rows.push([`Прибыль за ${periodMo} мес. (доп.), ₽`, '',                      round((dm.profitPark - sm.profitPark) * periodMo - (dm.capexTotal - sm.capexTotal))]);
  rows.push(['Окупаемость DrinkX быстрее на, мес', '',                         isFinite(sm.paybackMo - dm.paybackMo) ? round(sm.paybackMo - dm.paybackMo, 1) : 'N/A']);
  if (isRental) {
    rows.push(['', '', '']);
    rows.push(['— АРЕНДА DRINKX —', '', '']);
    rows.push(['Платёж за станцию / мес, ₽', '', round(offer.payment)]);
    rows.push(['Платёж за парк / мес, ₽', '', round(rr.paymentPark)]);
    rows.push(['Входит в платёж', '', MODEL.rental.includes.join('; ')]);
    rows.push(['Прибыль после платежа / мес, ₽', '', round(rr.profitAfterRent)]);
    rows.push(['Платёж к выручке, %', '', rr.rentShareOfRevenue == null ? '—' : round(rr.rentShareOfRevenue * 100)]);
    rows.push(['Переход собственности, месяц', '', rr.ownershipMonth == null ? 'Выкуп не предусмотрен' : rr.ownershipMonth]);
    if (rr.buyout.length) {
      rows.push(['График выкупа', 'Месяц', 'Уплачено, ₽', 'Зачёт, ₽', 'Доплата, ₽', 'Всего, ₽']);
      rr.buyout.forEach(row => {
        rows.push(['Контрольная точка выкупа', row.month, round(row.paid), round(row.credit), round(row.topUp), round(row.total)]);
      });
    }
  }
  return rows;
}

window.exportCSV = function() {
  const rows = buildExportRows();
  const esc  = v => {
    if (v == null) return '';
    const s = String(v);
    return /[",;\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const csv = '﻿' + rows.map(r => r.map(esc).join(';')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `drinkx-roi-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
};

window.exportPDF = function() {
  window.print();
};

window.arToggleTax = function() {
  window.__taxesOn = !window.__taxesOn;
  document.querySelectorAll('[data-tax-toggle]').forEach(b => b.classList.toggle('on', window.__taxesOn));
  updateAll();
};

function syncAcquisitionControls() {
  document.querySelectorAll('[data-acq-mode] button').forEach(button => {
    const active = button.dataset.acq === state.ui.acquisitionMode;
    button.classList.toggle('active', active);
    button.setAttribute('aria-pressed', String(active));
  });
  document.querySelectorAll('[data-rental-offer]').forEach(button => {
    const active = button.dataset.rentalOffer === state.ui.rentalOfferId;
    button.classList.toggle('active', active);
    button.setAttribute('aria-pressed', String(active));
  });
}

function updateAcquisitionUI() {
  syncAcquisitionControls();
  document.querySelectorAll('[data-acq-mode] button').forEach(button => {
    button.addEventListener('click', () => {
      state.ui.acquisitionMode = button.dataset.acq;
      syncAcquisitionControls();
      updateAll();
    });
  });
  document.querySelectorAll('[data-rental-offer]').forEach(button => {
    button.addEventListener('click', () => {
      state.ui.rentalOfferId = button.dataset.rentalOffer;
      syncAcquisitionControls();
      updateAll();
    });
  });
}

function setupHeroControls() {
  document.querySelectorAll('[data-ar-period] button').forEach(btn => {
    const p = parseInt(btn.dataset.period, 10);
    btn.classList.toggle('active', p === window.__periodMo);
    btn.addEventListener('click', () => {
      window.__periodMo = p;
      document.querySelectorAll('[data-ar-period] button').forEach(b => {
        b.classList.toggle('active', parseInt(b.dataset.period, 10) === p);
      });
      updateAll();
    });
  });
  document.querySelectorAll('[data-tax-toggle]').forEach(b => b.classList.toggle('on', window.__taxesOn));
}

applySharedStateFromHash();
populateInputs();
initChart();
setupInputListeners();
setupHeroControls();
updateAcquisitionUI();
updateAll();
initTooltips();
</script>
